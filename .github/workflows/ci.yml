name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Verify lockfile and tests
        run: |
          uv run --locked --python ${{ matrix.python-version }} ruff check .
          uv run --locked --python ${{ matrix.python-version }} ruff format --check .
          uv run --locked --python ${{ matrix.python-version }} pytest
      - name: Build and smoke-install release distributions
        run: |
          uv build --no-sources
          uv run --locked --python ${{ matrix.python-version }} python tools/check-release.py
