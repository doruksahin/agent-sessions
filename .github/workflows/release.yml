name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (leave empty to prepare releases)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: prepare
    if: >-
      always() && !cancelled() &&
      (needs.prepare.outputs.created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release target
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$RELEASE_TAG" --json tagName
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify both supported CI Python versions
        run: |
          for version in 3.11 3.13; do
            uv run --locked --python "$version" ruff check .
            uv run --locked --python "$version" ruff format --check .
            uv run --locked --python "$version" pytest
          done
          python3 .architecture/check.py --root .
      - name: Build and smoke-install both distributions
        run: |
          uv build --no-sources
          uv run --locked --python 3.11 python tools/check-release.py --tag "$RELEASE_TAG"
          uv run --locked --python 3.13 python tools/check-release.py --tag "$RELEASE_TAG"
      - name: Upload verified distributions and checksums
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
